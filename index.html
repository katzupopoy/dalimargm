<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dalimar General Merchandise - Wholesale Price List</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height: 100%;
  background: #1b0f0f;
  font-family: system-ui, -apple-system, sans-serif;
  color: #fff;
}
#pdfFrame {
  width: 100%;
  height: 100vh;
  border: none;
  display: block;
}
/* Mobile fallback */
#mobileFallback {
  display: none;
  min-height: 100vh;
  padding: 40px 20px;
  text-align: center;
  background: linear-gradient(135deg, #4a0d0d 0%, #7c0a02 50%, #b91c1c 100%);
}
#mobileFallback h1 {
  font-size: 28px;
  margin-bottom: 12px;
  font-weight: 800;
}
#mobileFallback p {
  opacity: 0.9;
  margin-bottom: 28px;
  line-height: 1.5;
}
.btn {
  display: inline-block;
  background: #facc15;
  color: #111827;
  font-weight: 800;
  padding: 16px 28px;
  border-radius: 14px;
  text-decoration: none;
  font-size: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}
.btn:active { transform: scale(0.98); }

@media (max-width: 768px) {
  #pdfFrame { display: none; }
  #mobileFallback { display: flex; flex-direction: column; align-items: center; justify-content: center; }
}
</style>
</head>
<body>

<!-- Desktop: embedded PDF -->
<iframe id="pdfFrame" src="Dalimar_Item_Master_Price_List (1).pdf" title="Dalimar Wholesale Price List"></iframe>

<!-- Mobile: open in native viewer -->
<div id="mobileFallback">
  <h1>Dalimar General Merchandise</h1>
  <p>Wholesale Price List</p>
  <a class="btn" href="Dalimar_Item_Master_Price_List (1).pdf" target="_blank">
    📄 Open Price List
  </a>
</div>

</body>
</html>
